name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Parley.slnx
      - name: Lint
        run: dotnet format Parley.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build Parley.slnx --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test tests/Parley.UnitTests --configuration Release --no-build
      - name: Integration tests
        run: dotnet test tests/Parley.IntegrationTests --configuration Release --no-build

  docker:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, workers]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: parley-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
