# Apply after the root and production Compose files, with the deployment .env.
services:
  mongodb:
    ports: !reset []
  redis:
    ports: !reset []
  rabbitmq:
    ports: !reset []
  mailpit:
    profiles: !reset []
    ports: !reset []
    mem_limit: 128m
  workers:
    ports: !reset []
  coturn:
    entrypoint: ["/bin/sh", "/parley/turn-entrypoint.sh"]
    environment:
      TURN_PUBLIC_IP: ${TURN_EXTERNAL_IP:?}
    volumes:
      - ./deploy/hetzner/turn-entrypoint.sh:/parley/turn-entrypoint.sh:ro
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?}
      - --realm=${TURN_REALM:?}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --stale-nonce=600
      - --user-quota=12
      - --total-quota=120
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
  api:
    image: parley-api:hetzner
    ports: !reset []
    networks:
      default: {}
      proxy:
        aliases: [parley-api]
    environment:
      TRUST_PROXY: 172.19.0.3/32
      PAYMENT_PROVIDER: none
      ADULT_CHAT_ENABLED: "false"
      COOKIE_SECURE: "true"
      RATE_LIMIT_MULTIPLIER: "1"
  frontend:
    image: parley-frontend:hetzner
    ports: !reset []
    networks:
      default: {}
      proxy:
        aliases: [parley-frontend]
networks:
  proxy:
    external: true
    name: proxy_network
