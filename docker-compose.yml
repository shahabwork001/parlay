# Backend stack: infrastructure + API + workers.
# Standalone:   docker compose up -d            (from /backend, after `cp .env.example .env`)
# Infra only:   docker compose up -d mongodb redis rabbitmq coturn mailpit   (run the API from your IDE)
# Full stack:   use the root docker-compose.yml, which includes this file.
name: parley

x-backend-environment: &backend-environment
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:?}:${MONGO_ROOT_PASSWORD:?}@mongodb:27017/?authSource=admin
  MONGO_DATABASE: ${MONGO_DATABASE:-parley}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  RABBITMQ_URL: amqp://${RABBITMQ_USERNAME:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  EVIDENCE_RETENTION_DAYS: ${EVIDENCE_RETENTION_DAYS:-30}
  MINOR_SAFETY_RETENTION_DAYS: ${MINOR_SAFETY_RETENTION_DAYS:-365}

x-backend-dependencies: &backend-dependencies
  mongodb:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  coturn:
    image: coturn/coturn:4.7
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?}
      - --realm=${TURN_REALM:-parley.local}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --stale-nonce=600
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient 127.0.0.1 > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    image: parley-api:local
    restart: unless-stopped
    environment:
      <<: *backend-environment
      CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?}
      HASH_SECRET: ${HASH_SECRET:?}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?}
      TERMS_VERSION: ${TERMS_VERSION:-2026-10-25}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      RATE_LIMIT_MULTIPLIER: ${RATE_LIMIT_MULTIPLIER:-1}
      MATCH_INTEREST_FALLBACK_MS: ${MATCH_INTEREST_FALLBACK_MS:-5000}
      TURN_SECRET: ${TURN_SECRET:?}
      TURN_URLS: ${TURN_URLS:-turn:localhost:3478?transport=udp,turn:localhost:3478?transport=tcp}
      STUN_URLS: ${STUN_URLS:-stun:localhost:3478}
      TURN_HEALTH_HOST: ${TURN_HEALTH_HOST:-coturn}
      WORKERS_HEALTH_URL: ${WORKERS_HEALTH_URL:-http://workers:8081/health/ready}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@parley.local}
    ports:
      - "8080:8080"
    depends_on: *backend-dependencies

  workers:
    build:
      context: .
      target: workers
    image: parley-workers:local
    restart: unless-stopped
    environment:
      <<: *backend-environment
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      EMAIL_FROM: ${EMAIL_FROM:-Parley <no-reply@parley.local>}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on: *backend-dependencies

volumes:
  mongo-data:
  redis-data:
  rabbitmq-data:
